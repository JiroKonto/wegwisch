ShortDescription: Tinder for your hard drive – swipe through what's eating your disk, biggest first.
Description: |-
  Wegwisch shows the biggest folders and files on your drives one card at a time.
  Swipe left to put something on the delete pile, right to keep it or look inside, up to ask an AI what it is.
  Includes a WinDirStat-style block view, a junk radar for caches and temp files, duplicate finding,
  proper uninstalling of programs and Recycle Bin cleanup. Nothing is deleted until you confirm,
  and everything goes to the Recycle Bin by default. Runs locally in your browser; nothing is uploaded.
