<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wegwisch</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo" id="logo">Weg<b>wisch</b></div>
  <div class="crumbs mono" id="crumbs"></div>
  <div class="scanpill" id="scanpill" hidden><span class="dot"></span><span id="scantxt"></span></div>
  <button class="hbtn" id="modeBtn" hidden></button>
  <button class="hbtn" id="langBtn">EN</button>
  <button class="hbtn" id="setBtn" title="Settings">⚙</button>
  <button class="hbtn tray" id="trayBtn">🗑 <span class="n" id="trayN">0</span> · <span id="trayS">0 B</span></button>
</header>
<main>
  <section class="screen on" id="start">
    <div class="step" id="step1">
      <h1 data-t="pickMode"></h1>
      <p class="sub" data-t="pickModeSub"></p>
      <div class="modes">
        <button class="mode" data-mode="swipe"><div class="mart" data-art="swipe"></div><b data-t="modeSwipe"></b><span data-t="modeSwipeSub"></span></button>
        <button class="mode" data-mode="classic"><div class="mart" data-art="classic"></div><b data-t="modeClassic"></b><span data-t="modeClassicSub"></span></button>
      </div>
      <h3 class="smartT" data-t="smartTitle"></h3>
      <div class="smart" id="smartGrid"></div>
    </div>
    <div class="step" id="step2" hidden>
      <button class="backlink" id="backMode">← <span data-t="changeMode"></span></button>
      <h1 data-t="pickDrive"></h1>
      <p class="sub" id="driveSub"></p>
      <div class="grid" id="driveGrid"></div>
    </div>
  </section>

  <section class="screen" id="classic">
    <div class="ctop">
      <button class="hbtn" id="cUp" title="Backspace">↑</button>
      <div class="cpath mono" id="cPath"></div>
      <input type="text" id="cFilter" spellcheck="false">
      <button class="hbtn" id="cMapBtn">▦</button>
    </div>
    <div class="cinfo" id="cInfo"></div>
    <div class="cmap" id="cMap"></div>
    <div class="ctable">
      <div class="crow chead">
        <span></span><span></span>
        <button data-sort="name" data-t="colName"></button>
        <button data-sort="size" data-t="colSize"></button>
        <span class="cpct">%</span>
        <button data-sort="files" class="cfiles" data-t="colFiles"></button>
        <button data-sort="mtime" class="cdate" data-t="colModified"></button>
        <span></span>
      </div>
      <div id="cRows"></div>
    </div>
  </section>

  <section class="screen" id="deckScreen">
    <div class="deck" id="deck"></div>
    <div class="left" id="leftN"></div>
    <div class="actions">
      <button class="act small" id="aUndo">↶</button>
      <button class="act del big" id="aDel">✕<small data-t="del"></small></button>
      <button class="act lock" id="aForever">🔒<small data-t="forever"></small></button>
      <button class="act askb" id="aAsk">✦<small data-t="ask"></small></button>
      <button class="act keep big" id="aKeep">✓<small id="keepLbl"></small></button>
      <button class="act small" id="aSkip">⏭</button>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <section class="screen" id="done">
    <div class="center">
      <div style="font-size:60px">✨</div>
      <h2 data-t="doneTitle"></h2>
      <p id="doneTxt"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn" id="doneOther" data-t="otherDrive"></button>
        <button class="btn primary" id="doneReview" data-t="reviewBtn"></button>
      </div>
    </div>
  </section>

  <section class="screen" id="review">
    <h2 data-t="pile"></h2>
    <p class="sub" id="revSub"></p>
    <div class="rlist" id="rlist"></div>
    <div class="rfoot">
      <button class="btn" id="revBack" data-t="back"></button>
      <button class="btn primary" id="doDelete" data-t="doDelete"></button>
    </div>
  </section>

  <section class="screen" id="result">
    <div class="center">
      <p data-t="resultTitle" style="font-weight:700;color:var(--text)"></p>
      <div class="freed" id="freedBig"></div>
      <p id="freedSub"></p>
      <p id="freedTime" class="ftime"></p>
      <p id="freedTrash" style="color:var(--warn)"></p>
      <div id="resBinBox" hidden><button class="btn primary" id="resBin"></button></div>
      <canvas id="shareCanvas" width="1200" height="630"></canvas>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn" id="saveImg" data-t="shareImg"></button>
        <button class="btn" id="copyImg" data-t="copyImg"></button>
        <button class="btn go" id="resContinue" data-t="continue"></button>
      </div>
      <p id="lifetime" style="font-size:13px"></p>
    </div>
  </section>
</main>

<div class="modal" id="settings">
  <div class="panel">
    <h3 data-t="settings"></h3>
    <div class="field"><label><span data-t="threads"></span><span id="thrVal" class="mono"></span></label>
      <input type="range" id="sThreads" min="1" max="32"><div class="h" data-t="threadsHint"></div></div>
    <div class="field"><label class="check"><input type="checkbox" id="sPrescan"><span><span data-t="prescan"></span><div class="h" data-t="prescanHint" style="font-weight:400"></div></span></label></div>
    <div class="field"><label><span data-t="aiProvider"></span></label>
      <select id="sAi"></select><div class="h" id="aiStatus"></div></div>
    <div class="field" id="fModel"><label><span data-t="model"></span></label>
      <select id="sModel"><option value="claude-opus-5">Claude Opus 5</option><option value="claude-sonnet-5">Claude Sonnet 5</option><option value="claude-haiku-4-5">Claude Haiku 4.5</option></select></div>
    <div class="field" id="fKey"><label><span data-t="apiKey"></span></label>
      <input type="password" id="sKey" autocomplete="off" spellcheck="false"><div class="h" id="keyHint"></div></div>
    <div class="field" id="fOllama"><label><span data-t="ollamaModel"></span></label><select id="sOllama"></select></div>
    <div class="field"><label class="check"><input type="checkbox" id="sCache"><span><span data-t="cachePerm"></span><div class="h" data-t="cachePermHint" style="font-weight:400"></div></span></label></div>
    <div class="field"><label><span data-t="language"></span></label>
      <select id="sLang"><option value="en">English</option><option value="de">Deutsch</option></select></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" id="setClose" data-t="back"></button>
      <button class="btn go" id="setSave" data-t="save"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="wwg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4d6d"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#2fd47a"/></linearGradient></defs></svg>
<script src="i18n.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
<script src="treemap.js"></script>
<script src="classic.js"></script>
</body>
</html>
